# CodeRabbit configuration.
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
# Reviews run on request only: comment @coderabbitai review on a pull request.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  auto_review:
    enabled: false
    # Kept for when automatic reviews are turned back on. This repository's
    # pull requests target `dev` (the standing integration branch), not the
    # default branch (`main`). CodeRabbit only auto-reviews the default branch
    # unless the target base is listed here, so list both explicitly,
    # otherwise dev-targeted PRs are skipped with "Auto reviews are disabled on
    # base/target branches other than the default".
    base_branches:
      - "main"
      - "dev"
