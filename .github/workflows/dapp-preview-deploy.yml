# Deploys previews for same-repository pull requests targeting main.
# Collaborators can also request a fresh preview with `/deploy`.
# Production auto-deploys from `main` through Vercel's Git integration
# (code/dApp/vercel.json); this workflow is the only path to preview
# deployments on other branches.
#
# Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The token comes from the Vercel account tokens page; the two IDs are in
# .vercel/project.json after `vercel link` from the repository root.
name: dapp-preview-deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  guard:
    # Ignore unrelated edits and comments before entering deploy concurrency.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event.issue.pull_request && github.event.comment.body == '/deploy')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      head: ${{ steps.check.outputs.head }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          state=$(jq -r .state <<<"$pr")
          base=$(jq -r .base.ref <<<"$pr")
          head_repo=$(jq -r .head.repo.full_name <<<"$pr")

          if [ "$state" != "open" ]; then
            echo "::notice::pull request is $state, skipping"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$base" != "main" ]; then
            echo "::notice::base branch '$base' is not main, skipping"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::fork pull requests cannot use deployment secrets, skipping"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            case "$COMMENT_AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                echo "::notice::comment author cannot request deployments, skipping"
                echo "allowed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"

  deploy-preview:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: dapp-preview-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.head }}
          persist-credentials: false

      - id: deploy
        name: Deploy preview with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          runner=(npx)
          if command -v sfw >/dev/null 2>&1; then
            runner=(sfw npx)
          else
            echo "::notice::sfw is not installed on this runner; using npx"
          fi
          url=$("${runner[@]}" --yes vercel@54.11.1 deploy --yes --target=preview --token "$VERCEL_TOKEN")
          if [ -z "$url" ]; then
            echo "deployment returned no URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Preview deployed: $PREVIEW_URL"
